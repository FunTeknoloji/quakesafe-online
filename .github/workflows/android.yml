name: Android Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > quakesafe.jks
      if: "${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release
      run: ./gradlew assembleRelease bundleRelease
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'quakesafe123' }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'quakesafe' }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'quakesafe123' }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QuakeSafe-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: QuakeSafe-AAB
        path: app/build/outputs/bundle/release/app-release.aab
