name: Android Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release
      run: ./gradlew assembleRelease bundleRelease

    - name: Export Upload Certificate (PEM)
      run: keytool -export -rfc -alias quakesafe -file upload_certificate.pem -keystore quakesafe.jks -storepass quakesafe123

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QuakeSafe-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: QuakeSafe-AAB
        path: app/build/outputs/bundle/release/*.aab

    - name: Upload PEM (For Key Reset)
      uses: actions/upload-artifact@v4
      with:
        name: QuakeSafe-PEM-Certificate
        path: upload_certificate.pem
